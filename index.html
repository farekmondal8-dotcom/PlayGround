<style>
:root{--ink:#183f3b;--mint:#dff8e9;--cream:#fff8df;--coral:#ff765d;--green:#4aaf7d;--gold:#ffd36b;--shadow:0 12px 35px #174c3d25}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:#a7dfca;touch-action:none}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#9dd8ea 0%,#d4f5d9 61%,#8bcf9d 100%)}#scene{position:absolute;inset:0;z-index:0}canvas{display:block;width:100%;height:100%;outline:none}.topbar{position:absolute;z-index:3;top:max(14px,env(safe-area-inset-top));left:18px;right:18px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand,.counter,.mini-btn,.quest,.bottom-panel,.target-card,.toast,.modal{box-shadow:var(--shadow)}.brand{border-radius:20px;background:#fffcf0ed;padding:10px 15px 10px 11px;display:flex;align-items:center;gap:10px;pointer-events:auto}.brand-mark{width:39px;height:39px;border-radius:14px;background:#e9584b;display:grid;place-items:center;box-shadow:inset 0 -4px #b33a3a;color:#fff;font-size:23px}.brand-name{font-weight:1000;font-size:15px;line-height:1}.brand-sub{font-size:10px;font-weight:800;letter-spacing:.11em;color:#64917d;margin-top:4px;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:9px;pointer-events:auto}.counter{background:#fffcf0ed;border-radius:18px;padding:9px 13px;display:flex;align-items:center;gap:8px;font-weight:950;font-size:14px}.counter .ball{font-size:21px}.icon-btn{width:42px;height:42px;border-radius:15px;background:#fffcf0ed;font-size:19px;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}.icon-btn:active,.action:active,.control:active{transform:scale(.94)}.quest{position:absolute;z-index:2;left:18px;top:88px;padding:11px 15px;border-radius:16px;background:#fffcf0e8;font-size:12px;font-weight:800;display:flex;gap:9px;align-items:center}.quest-icon{font-size:17px}.quest small{display:block;font-weight:650;color:#729185;margin-top:2px}.quest-progress{margin-left:7px;background:#e8f0db;padding:5px 8px;border-radius:10px;color:#397552}.bottom-panel{position:absolute;z-index:3;bottom:max(15px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(610px,calc(100% - 34px));min-height:91px;border-radius:24px;background:#fffcf0f2;padding:13px 15px;display:flex;align-items:center;gap:12px}.avatar{height:61px;width:61px;border-radius:19px;background:linear-gradient(145deg,#ffd99c,#f4a776);display:grid;place-items:center;font-size:32px;flex-shrink:0;border-bottom:4px solid #d88a63}.trainer-copy{flex:1;min-width:0}.trainer-name{font-size:14px;font-weight:1000}.trainer-hint{font-size:11px;color:#749087;font-weight:700;line-height:1.35;margin-top:3px}.actions{display:flex;gap:8px}.action{height:48px;min-width:57px;padding:0 12px;border-radius:16px;background:#e8f2e5;font-size:11px;font-weight:950;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s}.action .em{font-size:19px;line-height:18px}.action.primary{background:#e55548;color:white;box-shadow:inset 0 -4px #bf443e;min-width:82px}.action[disabled]{opacity:.48;cursor:default}.target-card{position:absolute;z-index:2;left:50%;bottom:125px;transform:translateX(-50%);width:min(330px,calc(100% - 46px));padding:10px 14px;border:2px solid #fff;background:#fff9e9ef;border-radius:19px;display:none;align-items:center;gap:12px}.target-card.show{display:flex;animation:pop .25s ease-out}.target-icon{width:45px;height:45px;background:#e9f4dc;border-radius:14px;display:grid;place-items:center;font-size:26px}.target-info{flex:1}.target-name{font-weight:1000;font-size:14px}.target-type{font-size:10px;font-weight:850;color:#76a287;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}.difficulty{font-size:10px;font-weight:900;color:#4f9e75}.hint-pill{position:absolute;z-index:2;right:19px;bottom:130px;border-radius:14px;padding:8px 11px;background:#fff9e9df;font-size:10px;font-weight:900;color:#668477;display:none}.joystick{position:absolute;z-index:3;left:22px;bottom:128px;width:96px;height:96px;border-radius:50%;background:#fffcf080;border:2px solid #fff9;display:none;touch-action:none}.joy-knob{position:absolute;left:50%;top:50%;width:43px;height:43px;transform:translate(-50%,-50%);border-radius:50%;background:#fffcf0e8;border:3px solid #77bc91;box-shadow:0 3px 9px #345d4533}.toast{position:absolute;z-index:8;top:23%;left:50%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;padding:12px 18px;border-radius:16px;background:#fff9e9;font-weight:950;font-size:14px;transition:.3s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-wrap{position:absolute;z-index:10;inset:0;display:none;place-items:center;background:#164c3f62;padding:20px;backdrop-filter:blur(7px)}.modal-wrap.open{display:grid}.modal{width:min(430px,100%);border-radius:27px;background:#fff9e8;padding:26px;text-align:center;animation:pop .25s ease-out}.modal h1{font-size:26px;margin:2px 0 7px}.modal p{font-size:13px;line-height:1.5;color:#648375;font-weight:650;margin:0 0 18px}.modal-emoji{font-size:56px;margin:4px}.modal-btn{background:#e55548;color:white;font-size:13px;font-weight:950;border-radius:15px;padding:13px 19px;box-shadow:inset 0 -4px #bf443e}.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:17px 0}.collection-item{background:#edf4e5;border-radius:14px;padding:10px 3px;font-size:25px}.collection-item span{display:block;font-size:9px;font-weight:850;margin-top:4px}.collection-item.empty{opacity:.42}.sound-on{color:#dd584c}@keyframes pop{from{transform:translateY(8px) scale(.93);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}
@media (min-width:800px){.bottom-panel{bottom:22px}.quest{top:94px}.target-card{bottom:130px}.joystick{display:none!important}.hint-pill{display:block}}@media(max-width:580px){.topbar{left:12px;right:12px;top:max(10px,env(safe-area-inset-top))}.brand{padding:8px 11px 8px 8px;border-radius:16px}.brand-mark{width:35px;height:35px}.brand-name{font-size:13px}.brand-sub{font-size:9px}.top-actions{gap:6px}.counter{padding:8px 10px;font-size:12px;border-radius:15px}.icon-btn{width:39px;height:39px;border-radius:14px}.quest{left:12px;top:72px;padding:8px 11px;font-size:11px}.bottom-panel{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100% - 22px);padding:10px;border-radius:21px;gap:9px;min-height:80px}.avatar{width:50px;height:50px;border-radius:16px;font-size:27px}.trainer-name{font-size:12px}.trainer-hint{font-size:10px}.action{min-width:47px;height:46px;padding:0 8px;border-radius:14px}.action.primary{min-width:69px}.target-card{bottom:202px}.joystick{display:block;left:15px;bottom:110px;width:84px;height:84px}.hint-pill{display:none}}

<body>
<div id="game">
 <div id="scene"></div>
 <header class="topbar"><div class="brand"><div class="brand-mark">◉</div><div><div class="brand-name">POKÉMON</div><div class="brand-sub">Meadow Quest</div></div></div><div class="top-actions"><div class="counter"><span class="ball">🔴</span><span id="ballCount">12</span></div><button class="icon-btn" id="dexBtn" aria-label="Pokédex">📖</button><button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button></div></header>
 <div class="quest"><span class="quest-icon">🌼</span><span>Meadow field research<small>Find Pokémon in the wild</small></span><span class="quest-progress" id="questCount">0 / 4</span></div>
 <div class="target-card" id="targetCard"><div class="target-icon" id="targetIcon">🐭</div><div class="target-info"><div class="target-name" id="targetName">Wild Pokémon</div><div class="target-type" id="targetType">Ready to catch!</div></div><div class="difficulty" id="targetDifficulty">★★★</div></div>
 <div class="hint-pill">WASD to roam · click a Pokémon</div>
 <div class="joystick" id="joystick"><div class="joy-knob" id="joyKnob"></div></div>
 <section class="bottom-panel"><div class="avatar">🧢</div><div class="trainer-copy"><div class="trainer-name">Trainer Ash</div><div class="trainer-hint" id="hintText">Look around for a Pokémon to catch!</div></div><div class="actions"><button class="action" id="runBtn"><span class="em">👟</span>RUN</button><button class="action" id="berryBtn"><span class="em">🍓</span>BERRY</button><button class="action primary" id="throwBtn"><span class="em">🔴</span>THROW</button></div></section>
 <div class="toast" id="toast"></div>
 <div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const mount=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;mount.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#a5dce8');scene.fog=new THREE.Fog('#b9ead2',21,60);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,120);camera.position.set(0,7.6,13);
scene.add(new THREE.HemisphereLight('#e7ffed','#698d65',2.2));const sun=new THREE.DirectionalLight('#fff4d2',3.2);sun.position.set(-6,13,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;scene.add(sun);
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const grassMat=mat('#77c985'), pathMat=mat('#e9cf9d'), hillMat=mat('#89ce95'), rockMat=mat('#9cae83'),white=mat('#fff8e6'),dark=mat('#34584a');
const ground=new THREE.Mesh(new THREE.CircleGeometry(33,64),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
// Soft rolling hills around the tiny meadow.
for(let i=0;i<14;i++){const a=i/14*Math.PI*2,r=23+(i%3)*1.5;const h=new THREE.Mesh(new THREE.SphereGeometry(6+(i%4),16,12),hillMat);h.scale.set(1.7,.52,1);h.position.set(Math.cos(a)*r,-1.7,Math.sin(a)*r);scene.add(h)}
// Winding sandy trail with flattened round segments.
const trailPoints=[[-1,0,17],[-1.2,0,12],[-.2,0,8],[2,0,4],[1,0,0],[-2,0,-4],[-1,0,-9],[2,0,-13]];
for(let i=0;i<trailPoints.length-1;i++){const p=trailPoints[i],q=trailPoints[i+1],dx=q[0]-p[0],dz=q[2]-p[2],len=Math.hypot(dx,dz);const m=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),pathMat);m.scale.set(1.48,.035,len/2+1.05);m.rotation.y=Math.atan2(dx,dz);m.position.set((p[0]+q[0])/2,-.015,(p[2]+q[2])/2);m.receiveShadow=true;scene.add(m)}
// flower patches, rocks, and trees add scale and cover.
const flowerColors=['#fff2a1','#f5a4b7','#fff8e6','#bc9bea'];
for(let i=0;i<190;i++){const a=Math.random()*Math.PI*2,r=4+Math.random()*19,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<2.1&&z>-10&&z<18)continue;const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.28,5),mat('#4d9d65'));stem.position.set(x,.12,z);scene.add(stem);const bloom=new THREE.Mesh(new THREE.SphereGeometry(.11,7,6),mat(flowerColors[i%flowerColors.length]));bloom.position.set(x,.31,z);bloom.scale.y=.7;scene.add(bloom)}
function tree(x,z,s=1){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,1.3*s,7),mat('#9b6848'));trunk.position.y=.6*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.IcosahedronGeometry((1.1-i*.12)*s,1),mat(['#61b878','#74c982','#54aa70'][i]));crown.position.set((i-1)*.43*s,1.55*s+i*.36*s,0);crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g)}
[[-8,-5,1.3],[-10,1,1.15],[9,-4,1.4],[10,4,1.2],[-7,10,1],[7,12,1.2],[-13,-11,1.4],[13,-13,1.3],[15,11,1.1]].forEach(v=>tree(...v));
for(let i=0;i<14;i++){const a=Math.random()*6.28,r=5+Math.random()*14,x=Math.cos(a)*r,z=Math.sin(a)*r;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.35+Math.random()*.55,0),rockMat);rock.position.set(x,.2,z);rock.scale.y=.65;rock.rotation.set(Math.random(),Math.random(),Math.random());rock.castShadow=true;scene.add(rock)}

const pokemonData=[
 {name:'Pikachu',type:'Electric mouse',emoji:'⚡',color:'#f5c94b',rarity:2,shape:'pikachu'},
 {name:'Bulbasaur',type:'Grass seed',emoji:'🌿',color:'#62bca0',rarity:2,shape:'bulba'},
 {name:'Charmander',type:'Fire lizard',emoji:'🔥',color:'#f38a56',rarity:3,shape:'charm'},
 {name:'Eevee',type:'Wild evolution',emoji:'🍂',color:'#b9855c',rarity:2,shape:'eevee'},
 {name:'Jigglypuff',type:'Balloon Pokémon',emoji:'🎵',color:'#ed9fb5',rarity:1,shape:'jiggly'},
 {name:'Psyduck',type:'Duck Pokémon',emoji:'💧',color:'#f0ce62',rarity:2,shape:'psyduck'}
];
const sphereGeo=new THREE.SphereGeometry(1,20,16);
function blob(parent,color,pos,scale,geo=sphereGeo){const o=new THREE.Mesh(geo,mat(color));o.position.set(...pos);o.scale.set(...scale);o.castShadow=true;parent.add(o);return o}
function ear(parent,x,y,z,color,scaleX=.22,scaleY=.68,rot=0){const e=blob(parent,color,[x,y,z],[scaleX,scaleY,.17],new THREE.ConeGeometry(1,1,8));e.rotation.z=rot;return e}
function makePokemon(data){const root=new THREE.Group(),c=data.color;root.userData.pokemon=data;
 blob(root,c,[0,.64,0],[.67,.66,.55]);blob(root,c,[0,1.25,.04],[.51,.49,.45]);
 // feet and tiny arms
 for(const x of [-.38,.38]){blob(root,c,[x,.16,.02],[.23,.17,.27]);blob(root,c,[x*1.35,.61,.12],[.2,.3,.2])}
 // round bright eyes and soft cheek spots
 for(const x of [-.19,.19]){blob(root,'#fffdf3',[x,1.33,.435],[.105,.13,.055]);blob(root,'#243b38',[x,1.33,.486],[.052,.085,.025])}
 blob(root,'#b76762',[0,1.12,.47],[.09,.035,.025]);
 if(data.shape==='pikachu'){for(const x of [-.34,.34]){ear(root,x,1.92,0,'#f3c53e',.16,.64,x<0?-.3:.3);blob(root,'#302d39',[x*1.05,2.38,.015],[.09,.11,.08])}for(const x of [-.42,.42])blob(root,'#ee765a',[x,1.1,.42],[.13,.12,.05]);const t=blob(root,'#f3c53e',[.65,.82,-.18],[.16,.16,.16]);t.rotation.z=-.4;blob(root,'#f3c53e',[.85,1.05,-.18],[.2,.24,.14]);blob(root,'#f3c53e',[.99,1.27,-.18],[.18,.21,.13]);blob(root,'#3b5f4c',[1.04,1.35,-.18],[.1,.11,.08])}
 if(data.shape==='bulba'){ear(root,-.48,1.66,0,'#67ba9c',.24,.38,-.55);ear(root,.48,1.66,0,'#67ba9c',.24,.38,.55);blob(root,'#68a66d',[0,1.55,-.12],[.5,.4,.43]);blob(root,'#5e9e66',[0,1.78,-.13],[.35,.3,.33]);for(let i=0;i<5;i++){const leaf=blob(root,i%2?'#4c925d':'#78bc6e',[(i-2)*.14,2.02,-.18],[.11,.34,.1],new THREE.ConeGeometry(1,1,6));leaf.rotation.z=(i-2)*.35}}
 if(data.shape==='charm'){ear(root,-.34,1.61,0,'#ee8a58',.2,.35,-.3);ear(root,.34,1.61,0,'#ee8a58',.2,.35,.3);const tail=blob(root,'#f28a53',[.48,.46,-.2],[.12,.42,.12]);tail.rotation.z=-.75;blob(root,'#ffb347',[.75,.77,-.2],[.17,.23,.15]);blob(root,'#ffd965',[.79,.92,-.2],[.095,.13,.09])}
 if(data.shape==='eevee'){for(const x of [-.32,.32])ear(root,x,1.84,0,'#9b6b4e',.2,.63,x<0?-.28:.28);blob(root,'#f1dfbd',[0,.97,.45],[.28,.19,.07]);blob(root,'#eadbb6',[0,.2,-.45],[.34,.44,.28]);blob(root,'#d7c497',[0,.36,-.55],[.29,.31,.2])}
 if(data.shape==='jiggly'){for(const x of [-.34,.34])ear(root,x,1.68,0,'#e596ac',.19,.43,x<0?-.3:.3);blob(root,'#fff8e6',[-.19,1.34,.46],[.11,.15,.06]);blob(root,'#fff8e6',[.19,1.34,.46],[.11,.15,.06]);blob(root,'#477c8d',[-.19,1.34,.51],[.06,.1,.03]);blob(root,'#477c8d',[.19,1.34,.51],[.06,.1,.03]);blob(root,'#fff5ee',[0,1.12,.48],[.2,.1,.03])}
 if(data.shape==='psyduck'){for(const x of [-.34,.34]){const tuft=blob(root,'#dfba57',[x*.25,1.88,-.03],[.1,.35,.1],new THREE.ConeGeometry(1,1,7));tuft.rotation.z=x<0?-.4:.4}blob(root,'#e8c35e',[0,.97,.47],[.29,.27,.12]);blob(root,'#cc9f44',[0,1.07,.59],[.19,.12,.07]);for(const x of [-.25,.25])blob(root,'#fff9e7',[x,1.43,.44],[.13,.19,.07]);for(const x of [-.25,.25])blob(root,'#332f31',[x,1.43,.5],[.045,.075,.025])}
 root.traverse(o=>{if(o.isMesh){o.castShadow=true}});root.position.y=0;return root}
const creatures=[];const spawnPoints=[[-5,0,-1],[4,0,-3],[-1,0,-7],[7,0,3],[-8,0,5],[2,0,8]];
function spawn(data,index,pos){const obj=makePokemon(data);obj.position.set(pos[0],0,pos[2]);obj.userData.baseY=0;obj.userData.phase=Math.random()*6;obj.userData.caught=false;obj.userData.index=index;scene.add(obj);creatures.push(obj);return obj}
const wild= pokemonData.map((p,i)=>spawn(p,i,spawnPoints[i]));
// A small trainer in the foreground gives the camera a clear point of view.
const trainer=new THREE.Group();blob(trainer,'#e0ad7f',[0,.84,0],[.38,.53,.3]);blob(trainer,'#fff6df',[0,.67,0],[.4,.28,.31]);blob(trainer,'#eab68c',[0,1.6,.02],[.32,.35,.3]);blob(trainer,'#c95347',[0,1.89,0],[.39,.14,.35]);blob(trainer,'#e95e4e',[0,1.78,.02],[.4,.1,.36]);for(const x of [-.13,.13])blob(trainer,'#273b3b',[x,1.62,.29],[.035,.05,.025]);blob(trainer,'#e3bb57',[0,1.84,.32],[.19,.07,.025]);trainer.position.set(0,0,8);scene.add(trainer);

const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let player={x:0,z:8},selected=null,berryBoost=false,berries=3,balls=12,caught=[],moving={x:0,z:0},sound=true,lastTime=0,toastTimer;
const ballCount=document.querySelector('#ballCount'),questCount=document.querySelector('#questCount'),targetCard=document.querySelector('#targetCard'),hintText=document.querySelector('#hintText');
try{const saved=JSON.parse(localStorage.getItem('meadowQuestSave')||'{}');caught=saved.caught||[];balls=saved.balls??12;berries=saved.berries??3}catch{}
ballCount.textContent=balls;questCount.textContent=`${caught.length} / 4`;
const selectRing=new THREE.Mesh(new THREE.RingGeometry(.72,.86,40),new THREE.MeshBasicMaterial({color:'#fff5a8',transparent:true,opacity:.88,side:THREE.DoubleSide}));selectRing.rotation.x=-Math.PI/2;selectRing.position.y=.035;selectRing.visible=false;scene.add(selectRing);
function toast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1900)}
function chirp(freq=560,duration=.08){if(!sound)return;try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration)}catch{}}
function save(){try{localStorage.setItem('meadowQuestSave',JSON.stringify({caught,balls,berries}))}catch{}}
function setTarget(p){selected=p;if(p){const d=p.userData.pokemon;document.querySelector('#targetIcon').textContent=d.emoji;document.querySelector('#targetName').textContent=d.name;document.querySelector('#targetType').textContent=d.type;document.querySelector('#targetDifficulty').textContent='★'.repeat(d.rarity)+'☆'.repeat(4-d.rarity);targetCard.classList.add('show');hintText.textContent=`${d.name} spotted! Tap THROW to catch it.`;selectRing.visible=true}else{targetCard.classList.remove('show');selectRing.visible=false;hintText.textContent='Look around for a Pokémon to catch!'}}
function pointSelect(event){const rect=renderer.domElement.getBoundingClientRect();pointer.x=(event.clientX-rect.left)/rect.width*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(creatures.filter(c=>!c.userData.caught).flatMap(c=>c.children),true);if(!hits.length)return;let obj=hits[0].object;while(obj&&!obj.userData.pokemon)obj=obj.parent;if(!obj)return;setTarget(obj);chirp(690,.06)}
renderer.domElement.addEventListener('pointerdown',e=>{if(e.target.closest?.('button'))return;pointSelect(e)});
function updateInventory(){ballCount.textContent=balls;questCount.textContent=`${caught.length} / 4`;save()}
function throwBall(){if(!selected||selected.userData.caught){toast('Tap a wild Pokémon first!');return}if(balls<=0){toast('Out of Poké Balls!');return}balls--;updateInventory();const target=selected,d=target.userData.pokemon;const ball=new THREE.Group();const red=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),mat('#e64f45'));const lower=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12,0,Math.PI*2,Math.PI/2,Math.PI/2),white);ball.add(red,lower);const band=new THREE.Mesh(new THREE.TorusGeometry(.18,.025,6,16),mat('#324d49'));ball.add(band);const button=blob(ball,'#fff8e6',[0,0,.17],[.065,.065,.025]);ball.position.set(player.x,.9,player.z);scene.add(ball);chirp(440,.1);
 const start=performance.now(),from=ball.position.clone(),to=target.position.clone().add(new THREE.Vector3(0,.8,0));function fly(now){const t=Math.min(1,(now-start)/430);ball.position.lerpVectors(from,to,t);ball.position.y+=Math.sin(t*Math.PI)*2.1;ball.scale.setScalar(1-t*.32);if(t<1){requestAnimationFrame(fly)}else{scene.remove(ball);scene.add(ball);ball.position.copy(to);target.visible=false;const distance=Math.hypot(target.position.x-player.x,target.position.z-player.z),chance=Math.max(.24,Math.min(.94,.83-(d.rarity-1)*.14-distance*.018+(berryBoost?.2:0)));berryBoost=false;setTimeout(()=>{if(Math.random()<chance){caught.push(d.name);target.userData.caught=true;target.visible=false;const burst=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),new THREE.MeshBasicMaterial({color:'#fff3ae',transparent:true,opacity:.9}));burst.position.copy(to);scene.add(burst);let k=0;const pop=()=>{k++;burst.scale.setScalar(1+k*.45);burst.material.opacity=Math.max(0,1-k/14);if(k<14)requestAnimationFrame(pop);else scene.remove(burst)};pop();setTarget(null);updateInventory();chirp(880,.2);toast(`Gotcha! ${d.name} was caught!`);if(caught.length>=4)setTimeout(showVictory,900)}else{target.visible=true;target.position.x+=Math.random()>.5?.65:-.65;setTarget(null);chirp(190,.16);toast(`${d.name} broke free! Try again!`)}},650)}}requestAnimationFrame(fly)}
function useBerry(){if(!selected){toast('Choose a Pokémon first!');return}if(berries<=0){toast('No berries left!');return}berries--;berryBoost=true;document.querySelector('#berryBtn').innerHTML=`<span class="em">🍓</span>${berries} LEFT`;toast(`A berry made ${selected.userData.pokemon.name} feel safe!`);chirp(740,.1);save()}
function runToTarget(){if(!selected){toast('Tap a Pokémon to approach it!');return}const dx=selected.position.x-player.x,dz=selected.position.z-player.z,len=Math.hypot(dx,dz)||1;player.x+=dx/len*2.7;player.z+=dz/len*2.7;player.x=Math.max(-17,Math.min(17,player.x));player.z=Math.max(-15,Math.min(17,player.z));trainer.position.x=player.x;trainer.position.z=player.z;toast(`You crept closer to ${selected.userData.pokemon.name}!`);chirp(520,.07)}
document.querySelector('#throwBtn').addEventListener('click',throwBall);document.querySelector('#berryBtn').addEventListener('click',useBerry);document.querySelector('#runBtn').addEventListener('click',runToTarget);
function openModal(html){const wrap=document.querySelector('#modalWrap');document.querySelector('#modal').innerHTML=html;wrap.classList.add('open')}
function closeModal(){document.querySelector('#modalWrap').classList.remove('open')}
document.querySelector('#modalWrap').addEventListener('pointerdown',e=>{if(e.target.id==='modalWrap')closeModal()});
document.querySelector('#dexBtn').addEventListener('click',()=>{const entries=pokemonData.map(p=>{const got=caught.includes(p.name);return `<div class="collection-item ${got?'':'empty'}">${got?p.emoji:'❔'}<span>${got?p.name:'???'}</span></div>`}).join('');openModal(`<div class="modal-emoji">📖</div><h1>Meadow Pokédex</h1><p>${caught.length} of 6 Pokémon discovered. Keep exploring the meadow!</p><div class="collection-grid">${entries}</div><button class="modal-btn" id="closeDex">KEEP EXPLORING</button>`);document.querySelector('#closeDex').onclick=closeModal});
document.querySelector('#soundBtn').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊':'🔇';e.currentTarget.classList.toggle('sound-on',!sound);if(sound)chirp(700,.08)});
function showVictory(){openModal(`<div class="modal-emoji">🏆</div><h1>Meadow Champion!</h1><p>You caught four Pokémon and completed your field research. A whole meadow of new friends awaits!</p><div class="collection-grid">${caught.slice(-4).map(n=>{const p=pokemonData.find(x=>x.name===n);return `<div class="collection-item">${p?.emoji||'⭐'}<span>${n}</span></div>`}).join('')}</div><button class="modal-btn" id="victoryClose">KEEP EXPLORING</button>`);document.querySelector('#victoryClose').onclick=closeModal}

// Soft clouds and a warm sun make the clearing read as a miniature 3D world.
const sunDisc=new THREE.Mesh(new THREE.CircleGeometry(2.1,32),new THREE.MeshBasicMaterial({color:'#fff0b5'}));sunDisc.position.set(-15,15,-32);scene.add(sunDisc);
for(let i=0;i<8;i++){const cloud=new THREE.Group();for(let j=0;j<4;j++){const puff=new THREE.Mesh(new THREE.SphereGeometry(.8+Math.random()*.55,12,10),new THREE.MeshBasicMaterial({color:'#f5fff0',transparent:true,opacity:.73}));puff.position.set(j*.75,.1+(j%2)*.24,0);cloud.add(puff)}cloud.position.set(-24+i*7,12+(i%3)*1.4,-25-Math.random()*12);cloud.scale.setScalar(.7+Math.random()*.5);scene.add(cloud)}
const keys={};window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key===' '){throwBall()}});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joystick=document.querySelector('#joystick'),joyKnob=document.querySelector('#joyKnob');let joyPointer=null;
function joyMove(e){if(joyPointer!==e.pointerId)return;const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,lim=r.width*.31,len=Math.hypot(dx,dy),scale=len>lim?lim/len:1;joyKnob.style.left=`calc(50% + ${dx*scale}px)`;joyKnob.style.top=`calc(50% + ${dy*scale}px)`;moving.x=dx*scale/lim;moving.z=dy*scale/lim}
joystick.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joystick.setPointerCapture(e.pointerId);joyMove(e)});joystick.addEventListener('pointermove',joyMove);function joyEnd(e){if(joyPointer===e.pointerId){joyPointer=null;moving.x=moving.z=0;joyKnob.style.left='50%';joyKnob.style.top='50%'}}joystick.addEventListener('pointerup',joyEnd);joystick.addEventListener('pointercancel',joyEnd);
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-lastTime)/1000||0);lastTime=now;let ix=moving.x,iz=moving.z;if(keys.w||keys.arrowup)iz-=1;if(keys.s||keys.arrowdown)iz+=1;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}player.x+=ix*dt*5.2;player.z+=iz*dt*5.2;player.x=Math.max(-17,Math.min(17,player.x));player.z=Math.max(-17,Math.min(18,player.z));trainer.position.x=player.x;trainer.position.z=player.z;trainer.rotation.y=Math.atan2(ix,iz);
 for(const c of creatures){if(c.userData.caught)continue;const phase=now*.002+c.userData.phase;c.position.y=.045+Math.sin(phase)*.07;c.rotation.y=Math.sin(phase*.55)*.17;c.scale.setScalar(1+Math.sin(phase*1.7)*.018)}
 if(selected&&!selected.userData.caught){selectRing.position.set(selected.position.x,.035,selected.position.z);selectRing.rotation.z=now*.0004;selectRing.scale.setScalar(1+Math.sin(now*.006)*.045)}
 const desired=new THREE.Vector3(player.x,10.5,player.z+13.5);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.x,1.1,player.z-2.5);renderer.render(scene,camera)}requestAnimationFrame(frame);
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?48:43;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2))}window.addEventListener('resize',resize);resize();
</script>
